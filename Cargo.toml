[package]
name = "turbotui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tiberius = { version = "0.12", default-features = false, features = ["sql-browser-tokio", "native-tls", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sqlformat = "0.2"
csv = "1.3"
anyhow = "1.0"
chrono = "0.4"
